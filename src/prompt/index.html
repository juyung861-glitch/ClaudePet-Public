<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>펫 받기</title>
  <link rel="stylesheet" href="prompt.css">
</head>
<body>
  <form id="form" autocomplete="off">
    <label for="ref">codex-pets.net 펫 주소, 설치 명령, 또는 펫 이름을 붙여넣으세요</label>
    <div class="row">
      <input id="ref" type="text" spellcheck="false" placeholder="https://codex-pets.net/#/pets/펫이름">
      <button id="go" type="submit">받기</button>
    </div>
    <p id="hint">예: <code>npx codex-pets add 펫이름</code> · <code>펫이름</code> · 내려받은 zip 경로</p>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <script src="prompt.js"></script>
</body>
</html>
