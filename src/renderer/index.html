<!doctype html>
<html lang="ko">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'">
  <title>ClaudePet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
