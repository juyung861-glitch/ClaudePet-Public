name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 테스트는 Node 내장 기능만 쓰므로 의존성 설치가 필요 없어요
      - run: node --test test/*.test.js
